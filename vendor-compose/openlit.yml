# НАШ конфиг запуска OpenLIT — НЕ патч вендора (файлы `vendor/openlit/` не меняются).
#
# **Почему файл лежит в `infra/`.** Клон дерева вендора (`vendor/openlit/`) не меняется: файловых
# патчей нет и не планируется, поэтому машинерия патчей была бы ложной. А `infra/` — наш
# эксплуатационный репозиторий: сторожа, юниты, проверки, реестры. «Как мы запускаем стек этого
# вендора» — операция, ей здесь и место.
#
# ❗ **Порядок `-f` НЕСУЩИЙ:** подавать только как
#   docker compose -f vendor/openlit/docker-compose.yml -f infra/vendor-compose/openlit.yml
# Каталог проекта берётся от ПЕРВОГО файла. Обратный порядок увёл бы относительные bind'ы
# (`./assets/clickhouse-config.xml`, `./assets/clickhouse-init.sh`, `./assets/otel-collector-config.yaml`)
# в `infra/` — их там нет, ClickHouse стартовал бы без своего конфига МОЛЧА, а тома получили бы префикс
# `infra_` ⇒ новый ПУСТОЙ SQLite и пустой ClickHouse. Ошибка не косметическая.
#
# Что здесь меняется и почему — в комментариях у каждой строки.

services:
  # ❗ Образы закрепляем ЗДЕСЬ, хотя вендор свой ClickHouse уже пиннит: файл вендора берёт приложение
  # как `:latest`, и без этой строки «пин 2.1.0» был бы фикцией. Пара к пину клона: тег
  # `openlit-2.1.0` ⇒ образ `2.1.0`.
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    # Порты наружу НЕ публикуем: внутри стека ClickHouse берётся по ИМЕНИ СЛУЖБЫ
    # (`INIT_DB_HOST: clickhouse` в файле вендора), поэтому 8123/9000 нужны только внутри сети compose.
    # ❗ `!reset`, а не «просто не указывать»: compose ОБЪЕДИНЯЕТ `ports`, и вендорские 8123/9000 остались бы.
    ports: !reset null
    # `unless-stopped`, а НЕ `always`: `always` поднимает контейнер при старте демона даже после РУЧНОЙ
    # остановки, а нам нужно ровно обратное — погашенный вендор обязан остаться погашенным после
    # перезагрузки (требование владельца «стартует только выбранный»). `unless-stopped` помнит остановку.
    restart: unless-stopped
    # Инициализация ClickHouse — ПИК, а не норма (`CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: true`,
    # `start_period: 100s`). Жёсткий лимит ниже пика не даёт стать `healthy`, а `depends_on:
    # condition: service_healthy` не пустит `openlit` вовсе ⇒ цикл перезапусков. Отсюда запас.
    mem_limit: 2g
    memswap_limit: 2g      # = mem_limit ⇒ своп для контейнера выключен: хост уже в свопе, треш не нужен

  openlit:
    image: ghcr.io/openlit/openlit:2.1.0
    # ❗❕ САМОЕ ОПАСНОЕ МЕСТО ЭТОГО ФАЙЛА. Вендор публикует `${PORT:-3000}:${DOCKER_PORT:-3000}` — то есть
    # хост-порт 3000, а он у нас ЗАНЯТ (`mcp-searxng`). Compose объединяет `ports` по ключу
    # `{ip,target,published,protocol}`: добавление `3300:3000` НЕ УБРАЛО бы `3000:3000`, и первый `up`
    # упал бы на конфликте. Поэтому — `!override`: список заменяется ЦЕЛИКОМ.
    ports: !override
      - "127.0.0.1:3300:3000"   # UI — только с хоста владельца (3000 занят нашим mcp-searxng)
      - "4318:4318"             # OTLP/HTTP — на ВСЕ интерфейсы: см. пункт ниже
      # 4317 (gRPC) СОЗНАТЕЛЬНО не публикуем: наш экспортёр ходит по HTTP, а лишний открытый порт не нужен.
    # ❗ Почему OTLP не на loopback: наши контейнеры ходят к приёму через `host.docker.internal`, а это
    # адрес моста (≈172.17.0.1), а не 127.0.0.1. Порт, опубликованный только на loopback, оттуда
    # НЕДОСТУПЕН. Так же опубликован порт платформы (8680 на 0.0.0.0) — и это работает.
    restart: unless-stopped
    # UI внутри ограничен `node --max_old_space_size=512`; ниже ~800 МБ он падает. Отсюда запас.
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      # Эгресс вендора закрыт: OpenLIT по умолчанию шлёт СВОЮ телеметрию (`TELEMETRY_ENABLED: "true"` в
      # файле вендора). Нам это не нужно и наружу уходить не должно — так же закрыт эгресс любого стека
      # наблюдаемости.
      TELEMETRY_ENABLED: "false"
