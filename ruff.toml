# Правила линтера: свой файл, чтобы проверка не зависела от настроек каталога выше.
line-length = 110
target-version = "py311"
#: Шаблон проекта — не модуль: в именах там подстановки (`__PROJECT___agent`).
extend-exclude = ["templates"]

[lint]
#: Базовый набор: ошибки и неопределённые имена. Расширенные правила (SIM, RUF) проверяются отдельно,
#: когда код готов к ним; здесь важно не блокировать публикацию шумом.
select = ["E4", "E7", "E9", "F"]
